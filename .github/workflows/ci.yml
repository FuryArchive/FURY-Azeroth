name: FURY CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fury-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Locked upstream build
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout FURY
        uses: actions/checkout@v4

      - name: Install AzerothCore build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git cmake make gcc g++ clang \
            libssl-dev libbz2-dev libreadline-dev libncurses-dev \
            libboost-all-dev libmysqlclient-dev

      - name: Resolve locked upstream source
        run: bash scripts/sync-upstreams.sh

      - name: Build
        env:
          FURY_BUILD_JOBS: "2"
        run: bash scripts/build.sh
