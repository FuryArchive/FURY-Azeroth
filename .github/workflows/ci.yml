name: FURY CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fury-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actor-policy-golden:
    name: M1 actor-policy golden gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout FURY
        uses: actions/checkout@v4

      - name: Run actor classification golden scenarios
        run: bash scripts/test-m1-actor-policy.sh

  module-compile:
    name: Fast mod-fury compile
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout FURY
        uses: actions/checkout@v4

      - name: Install AzerothCore build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git cmake make gcc g++ clang ccache \
            libssl-dev libbz2-dev libreadline-dev libncurses-dev \
            libboost-all-dev libmysqlclient-dev

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: fury-module-ccache-${{ runner.os }}-${{ hashFiles('vendor/lock/fury.lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            fury-module-ccache-${{ runner.os }}-${{ hashFiles('vendor/lock/fury.lock.yaml') }}-
            fury-module-ccache-${{ runner.os }}-

      - name: Configure compiler cache
        run: |
          ccache --set-config=max_size=1G
          ccache --set-config=compression=true
          ccache --zero-stats

      - name: Resolve locked upstream source
        run: bash scripts/sync-upstreams.sh

      - name: Compile mod-fury only
        env:
          FURY_BUILD_JOBS: "4"
          FURY_BUILD_TARGET: fury-only
        run: bash scripts/build.sh

  ip-adapter-golden:
    name: T19 IP read-only/absence golden gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout FURY
        uses: actions/checkout@v4

      - name: Run IP read-only and optional-module golden scenarios
        run: bash scripts/test-m2-ip-adapter.sh

  ip-schema-golden:
    name: T19 Campaign IP schema golden gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fury
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pfury --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout FURY
        uses: actions/checkout@v4

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y default-mysql-client

      - name: Run T19 Campaign IP schema gate
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: fury
          MYSQL_DATABASE: acore_fury
        run: bash scripts/test-m2-ip-schema.sh

