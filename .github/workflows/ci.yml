name: FURY CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fury-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  actor-policy-golden:
    name: M1 actor-policy golden gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout FURY
        uses: actions/checkout@v4

      - name: Run actor classification golden scenarios
        run: bash scripts/test-m1-actor-policy.sh

  build:
    name: Locked worldserver + M1 runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fury
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pfury --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout FURY
        uses: actions/checkout@v4

      - name: Install AzerothCore build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git cmake make ninja-build gcc g++ clang ccache curl unzip \
            libssl-dev libbz2-dev libreadline-dev libncurses-dev \
            libboost-all-dev libmysqlclient-dev default-mysql-client

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: fury-ccache-${{ runner.os }}-${{ hashFiles('vendor/lock/fury.lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            fury-ccache-${{ runner.os }}-${{ hashFiles('vendor/lock/fury.lock.yaml') }}-
            fury-ccache-${{ runner.os }}-

      - name: Configure compiler cache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --zero-stats

      - name: Resolve locked upstream source
        run: bash scripts/sync-upstreams.sh

      - name: Build
        env:
          FURY_BUILD_JOBS: "4"
        run: bash scripts/build.sh

      - name: Run real FURY database lifecycle smoke
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: fury
        run: bash scripts/smoke-fury-db-lifecycle.sh

      - name: Reclaim compile workspace before runtime data
        run: |
          rm -rf build/azerothcore
          df -h .

      - name: Restore pinned AzerothCore runtime-data archive
        uses: actions/cache@v4
        with:
          path: .cache/ac-data-v20.0/Data.zip
          key: ac-data-v20.0-enUS-a3d4df635ae6c2c8

      - name: Install pinned AzerothCore runtime data
        run: bash scripts/fetch-ac-data.sh

      - name: Run full M1 worldserver smoke twice
        env:
          FURY_STARTUP_TIMEOUT: "600"
          FURY_SMOKE_RUNS: "2"
          FURY_WORLDSERVER_CONF: ${{ github.workspace }}/build/dist/etc/worldserver.conf.dist
          AC_DATA_DIR: ${{ github.workspace }}/build/dist/data
          AC_LOGIN_DATABASE_INFO: "127.0.0.1;3306;root;fury;acore_auth"
          AC_WORLD_DATABASE_INFO: "127.0.0.1;3306;root;fury;acore_world"
          AC_CHARACTER_DATABASE_INFO: "127.0.0.1;3306;root;fury;acore_characters"
          AC_UPDATES_ENABLE_DATABASES: "7"
          AC_UPDATES_AUTO_SETUP: "1"
          AC_PLAYERBOTS_DATABASE_INFO: "127.0.0.1;3306;root;fury;acore_playerbots"
          AC_PLAYERBOTS_UPDATES_ENABLE_DATABASES: "1"
          AC_FURY_ENABLE: "1"
          AC_FURY_DATABASE_INFO: "127.0.0.1;3306;root;fury;acore_fury"
          AC_FURY_UPDATES_ENABLE_DATABASES: "1"
          AC_FURY_DATABASE_SOURCE_DIRECTORY: ${{ github.workspace }}/modules/mod-fury
          AC_CONSOLE_ENABLE: "1"
          AC_BEEP_AT_START: "0"
          AC_LOG_ASYNC_ENABLE: "0"
        run: bash scripts/smoke-worldserver.sh

  module-compile:
    name: Fast mod-fury compile
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout FURY
        uses: actions/checkout@v4

      - name: Install AzerothCore build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git cmake make gcc g++ clang ccache \
            libssl-dev libbz2-dev libreadline-dev libncurses-dev \
            libboost-all-dev libmysqlclient-dev

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: fury-module-ccache-${{ runner.os }}-${{ hashFiles('vendor/lock/fury.lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            fury-module-ccache-${{ runner.os }}-${{ hashFiles('vendor/lock/fury.lock.yaml') }}-
            fury-module-ccache-${{ runner.os }}-

      - name: Configure compiler cache
        run: |
          ccache --set-config=max_size=1G
          ccache --set-config=compression=true
          ccache --zero-stats

      - name: Resolve locked upstream source
        run: bash scripts/sync-upstreams.sh

      - name: Compile mod-fury only
        env:
          FURY_BUILD_JOBS: "4"
          FURY_BUILD_TARGET: fury-only
        run: bash scripts/build.sh

  proof-policy-golden:
    name: T14 Proof policy golden gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout FURY
        uses: actions/checkout@v4

      - name: Run Proof authority policy golden scenarios
        run: bash scripts/test-m2-proof-policy.sh

  proof-schema-golden:
    name: T14 Proof schema golden gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fury
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pfury --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout FURY
        uses: actions/checkout@v4

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y default-mysql-client

      - name: Run T14 Proof schema golden gate
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: fury
          MYSQL_DATABASE: acore_fury
        run: bash scripts/test-m2-proof-schema.sh

  campaign-policy-golden:
    name: T13 Campaign policy golden gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout FURY
        uses: actions/checkout@v4

      - name: Run Campaign transition policy golden scenarios
        run: bash scripts/test-m2-campaign-policy.sh

  campaign-schema-golden:
    name: T13 Campaign schema golden gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fury
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pfury --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout FURY
        uses: actions/checkout@v4

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y default-mysql-client

      - name: Run T13 Campaign schema golden gate
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: fury
          MYSQL_DATABASE: acore_fury
        run: bash scripts/test-m2-campaign-schema.sh

  schema-golden:
    name: M1 schema golden gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fury
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pfury --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout FURY
        uses: actions/checkout@v4

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y default-mysql-client

      - name: Run M1 schema golden gate
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: fury
          MYSQL_DATABASE: acore_fury
        run: bash scripts/test-m1-schema.sh
