name: FURY CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fury-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Locked upstream build
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout FURY
        uses: actions/checkout@v4

      - name: Install AzerothCore build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git cmake make gcc g++ clang \
            libssl-dev libbz2-dev libreadline-dev libncurses-dev \
            libboost-all-dev libmysqlclient-dev

      - name: Resolve locked upstream source
        run: bash scripts/sync-upstreams.sh

      - name: Build
        env:
          FURY_BUILD_JOBS: "2"
        run: bash scripts/build.sh


  schema-golden:
    name: M1 schema golden gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fury
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -hfury --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout FURY
        uses: actions/checkout@v4

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y default-mysql-client

      - name: Run M1 schema golden gate
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: fury
          MYSQL_DATABASE: acore_fury
        run: bash scripts/test-m1-schema.sh
