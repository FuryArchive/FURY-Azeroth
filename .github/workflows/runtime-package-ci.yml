name: FURY Runtime Package CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "runtime/**"
      - ".github/workflows/runtime-package-ci.yml"
      - ".github/workflows/playable-profile.yml"
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - ".github/workflows/runtime-package-ci.yml"
      - ".github/workflows/playable-profile.yml"

jobs:
  runtime-static:
    name: Runtime package static acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in runtime/*.sh; do
            echo "checking ${script}"
            bash -n "${script}"
          done

      - name: Validate playable workflow structure
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/playable-profile.yml")
          text = path.read_text()

          expected_once = [
              "- name: Prepare downloadable server/client packages",
              "- name: Smoke downloadable server archive",
              "- name: Smoke downloadable client overlay",
              "- name: Upload playable server",
              "- name: Upload playable client overlay",
          ]
          for marker in expected_once:
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(
                      f"[FURY][WORKFLOW][FAIL] {marker!r} occurs {count} times, expected exactly once"
                  )

          required_lines = [
              "grep -Eq '^ProgressionSystem\\.Bracket_0[[:space:]]*=[[:space:]]*1[[:space:]]*$' etc/modules/progression_system.conf",
              "grep -Eq '^AiPlayerbot\\.MinRandomBots[[:space:]]*=[[:space:]]*80[[:space:]]*$' etc/modules/playerbots.conf",
              "grep -Eq '^LivingWorld\\.Debug[[:space:]]*=[[:space:]]*0[[:space:]]*$' etc/modules/mod_living_world.conf",
              "grep -Eq '^ModZoneDifficulty\\.Mythicmode\\.Enable[[:space:]]*=[[:space:]]*0[[:space:]]*$' etc/modules/mod-zone-difficulty.conf",
          ]
          for line in required_lines:
              if line not in text:
                  raise SystemExit(f"[FURY][WORKFLOW][FAIL] missing complete assertion: {line}")

          if text.count('AC_DISABLE_INTERACTIVE: "1"') != 2:
              raise SystemExit("[FURY][WORKFLOW][FAIL] expected two noninteractive DB env entries")

          print("[FURY][WORKFLOW][PASS] playable workflow structure is clean")
          PY

      - name: Validate embedded Python heredocs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          total = 0
          for path in sorted(Path("runtime").glob("*.sh")):
              lines = path.read_text().splitlines()
              blocks = []
              i = 0
              while i < len(lines):
                  if "<<'PY'" not in lines[i]:
                      i += 1
                      continue
                  block = []
                  i += 1
                  while i < len(lines) and lines[i] != "PY":
                      block.append(lines[i])
                      i += 1
                  if i >= len(lines):
                      raise SystemExit(f"unterminated Python heredoc in {path}")
                  blocks.append("\n".join(block) + "\n")
                  i += 1

              for index, block in enumerate(blocks, 1):
                  compile(block, f"{path}:PY#{index}", "exec")
              if blocks:
                  print(f"validated {len(blocks)} embedded Python blocks in {path}")
                  total += len(blocks)

          if total == 0:
              raise SystemExit("no embedded Python blocks found in runtime scripts")
          print(f"validated {total} embedded Python blocks total")
          PY

      - name: Verify MySQL wrapper argument bridge
        shell: bash
        run: |
          set -euo pipefail
          fake_bin="$(mktemp -d)"
          trap 'rm -rf "${fake_bin}"' EXIT
          cat > "${fake_bin}/docker" <<'SH'
          #!/usr/bin/env bash
          printf '%s\n' "$@"
          SH
          chmod +x "${fake_bin}/docker"

          output="$(
            PATH="${fake_bin}:${PATH}" \
            FURY_MYSQL_PASSWORD="runtime-ci-secret" \
            bash runtime/mysql-wrapper.sh \
              --defaults-extra-file=/tmp/acore.cnf \
              --host 10.10.10.10 \
              --port 3399 \
              --user root \
              acore_world
          )"

          ! grep -Fq -- "--defaults-extra-file=" <<<"${output}"
          ! grep -Fxq -- "10.10.10.10" <<<"${output}"
          ! grep -Fxq -- "3399" <<<"${output}"
          grep -Fxq -- "-pruntime-ci-secret" <<<"${output}"
          grep -Fxq -- "-h127.0.0.1" <<<"${output}"
          grep -Fxq -- "-P3306" <<<"${output}"
          grep -Fxq -- "--protocol=TCP" <<<"${output}"
          grep -Fxq -- "--user" <<<"${output}"
          grep -Fxq -- "root" <<<"${output}"
          grep -Fxq -- "acore_world" <<<"${output}"

      - name: Verify downloadable-runtime guardrails
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'runtime-source/data/sql' runtime/bootstrap-playable.sh
          grep -Fq 'runtime/mysql-wrapper.sh' runtime/bootstrap-playable.sh
          grep -Fq 'SourceDirectory' runtime/bootstrap-playable.sh
          grep -Fq 'MySQLExecutable' runtime/bootstrap-playable.sh
          grep -Fq 'DataDir' runtime/bootstrap-playable.sh
          grep -Fq 'runtime-libs' runtime/bootstrap-playable.sh
          grep -Fq 'LD_LIBRARY_PATH' runtime/bootstrap-playable.sh
          grep -Fq 'runtime-libs' runtime/run-playable.sh
          grep -Fq 'server is not bootstrapped yet' runtime/run-playable.sh
          grep -Fq 'progression_bracket' runtime/bootstrap-playable.sh
          grep -Fq 'backup-playable.sh' runtime/advance-progression.sh
          grep -Fq 'configure-llm-chatter.sh' runtime/bootstrap-playable.sh
          grep -Fq -- '--profile llm' runtime/run-playable.sh
          grep -Fq 'llm-bridge.Dockerfile' runtime/docker-compose.playable.yml
          grep -Fq 'context: ../llm-chatter' runtime/docker-compose.playable.yml
          grep -Fq 'COPY requirements.txt' runtime/llm-bridge.Dockerfile
          grep -Fq 'sha256sum -c' runtime/llm-bridge.Dockerfile
          grep -Fq 'network_mode: host' runtime/docker-compose.playable.yml
          grep -Fq '127.0.0.1:11434' runtime/configure-llm-chatter.sh
