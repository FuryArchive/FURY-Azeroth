name: Eluna Playerbots Reconciliation Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "vendor/lock/fury.lock.yaml"
      - "scripts/audit-eluna-playerbots-merge.sh"
      - ".github/workflows/eluna-playerbots-audit.yml"
  push:
    branches: [main]
    paths:
      - "vendor/lock/fury.lock.yaml"
      - "scripts/audit-eluna-playerbots-merge.sh"
      - ".github/workflows/eluna-playerbots-audit.yml"

concurrency:
  group: eluna-playerbots-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Three-way merge audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned Playerbots baseline
        run: bash scripts/sync-upstreams.sh

      - name: Audit pinned standard-Eluna merge
        run: bash scripts/audit-eluna-playerbots-merge.sh

      - name: Upload merge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eluna-playerbots-merge-audit
          path: build/eluna-playerbots-merge-audit.txt
