name: Delves Integration CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "vendor/lock/fury.lock.yaml"
      - "scripts/sync-integration.sh"
      - "scripts/merge-delves-dbc.py"
      - "scripts/stage-delves-integration.sh"
      - "scripts/test-delves-integration.sh"
      - "scripts/audit-delves-eluna-api.py"
      - ".github/workflows/delves-integration.yml"
      - "docs/DELVES_INTEGRATION.md"
  push:
    branches: [main]
    paths:
      - "vendor/lock/fury.lock.yaml"
      - "scripts/sync-integration.sh"
      - "scripts/merge-delves-dbc.py"
      - "scripts/stage-delves-integration.sh"
      - "scripts/test-delves-integration.sh"
      - "scripts/audit-delves-eluna-api.py"
      - ".github/workflows/delves-integration.yml"

concurrency:
  group: delves-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Delves content + standard Eluna contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y git lua5.1

      - name: Resolve Playerbots + standard Eluna
        run: |
          bash scripts/sync-upstreams.sh
          bash scripts/resolve-eluna-playerbots.sh

      - name: Resolve pinned Delves content
        run: bash scripts/sync-integration.sh delves

      - name: Stage Delves server/client inputs
        run: bash scripts/stage-delves-integration.sh

      - name: Validate Lua syntax
        run: |
          while IFS= read -r -d '' file; do
            luac5.1 -p "${file}"
          done < <(find build/delves-integration/server/lua_scripts -type f -name '*.lua' -print0)
          echo "[FURY][DELVES][PASS] Lua 5.1 syntax"

      - name: Validate standard Eluna API surface
        run: |
          python3 scripts/audit-delves-eluna-api.py \
            --lua-dir build/delves-integration/server/lua_scripts \
            --eluna-dir upstream/azerothcore-wotlk/src/server/game/LuaEngine

      - name: Validate Delves packaging contract
        run: bash scripts/test-delves-integration.sh
